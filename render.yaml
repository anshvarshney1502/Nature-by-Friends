# Render Blueprint: one Node web service serves pages and /api/* (Next.js).
# The photo helper calls the Google Gemini API (set GEMINI_API_KEY).
# Plan "starter" avoids free-tier cold starts during judging; "free" also works. Check current Render pricing.
services:
  - type: web
    name: nature-by-friends
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
