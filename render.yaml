# Render Blueprint: one Node web service serves pages and /api/* (Next.js).
# The photo helper calls the Google Gemini API (set GEMINI_API_KEY).
# Free plan (what the live demo uses): sleeps when idle, so the first visit takes ~1 min. "starter" avoids that (paid).
services:
  - type: web
    name: nature-by-friends
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    # next start reads $PORT from Render
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: GEMINI_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
