<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Nature by Friends: a storybook garden with a tree, sunflower, butterfly, bee, ladybug and snail">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe8f3"/>
      <stop offset="1" stop-color="#fbf5e6"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#24452a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="36" fill="url(#sky)"/>
  <!-- sun & clouds -->
  <circle cx="1060" cy="92" r="46" fill="#f6d77a"/>
  <circle cx="1060" cy="92" r="70" fill="#f6d77a" opacity="0.25"/>
  <path d="M120 96 q 22 -22 48 0 q 22 -16 38 6 h -86 z" fill="#fffdf7"/>
  <path d="M880 70 q 16 -16 34 0 q 16 -12 28 4 h -62 z" fill="#fffdf7"/>
  <!-- hills -->
  <path d="M0 300 C 200 240, 420 250, 600 290 C 800 250, 1000 245, 1200 270 L 1200 420 L 0 420 Z" fill="#b7d79a"/>
  <path d="M0 345 C 260 315, 560 325, 760 340 C 940 325, 1080 322, 1200 330 L 1200 420 L 0 420 Z" fill="#8fbf6a"/>
  <path d="M0 385 C 360 370, 820 372, 1200 380 L 1200 420 L 0 420 Z" fill="#6ea64b"/>
  <!-- grass -->
  <g stroke="#3f6e2c" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M60 395 q 3 -16 8 -24"/><path d="M110 398 q -2 -14 -8 -22"/><path d="M1080 396 q 3 -16 8 -24"/><path d="M1130 398 q -2 -14 -8 -22"/>
    <path d="M520 402 q 3 -14 8 -20"/><path d="M700 402 q -2 -14 -8 -20"/>
  </g>

  <!-- tree -->
  <g transform="translate(70 120) scale(1.9)" filter="url(#soft)">
    <path d="M48 118 C 52 100, 50 82, 46 70 L 74 70 C 70 82, 68 100, 72 118 Z" fill="#a46e48" stroke="#2d2a22" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M60 8 C 84 6, 104 22, 104 42 C 112 56, 100 76, 80 74 C 70 82, 50 82, 40 74 C 20 76, 8 58, 16 44 C 14 24, 36 8, 60 8 Z" fill="#7cb35a" stroke="#2d2a22" stroke-width="2.5"/>
    <circle cx="40" cy="56" r="3" fill="#e0785f"/><circle cx="84" cy="30" r="3" fill="#e0785f"/>
    <circle cx="54" cy="92" r="4" fill="#fff" stroke="#2d2a22" stroke-width="2"/><circle cx="55" cy="92" r="2.2" fill="#2d2a22"/>
    <circle cx="66" cy="92" r="4" fill="#fff" stroke="#2d2a22" stroke-width="2"/><circle cx="67" cy="92" r="2.2" fill="#2d2a22"/>
    <path d="M57 101 q 3 3.6 6 0" fill="none" stroke="#2d2a22" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- title -->
  <g font-family="'Fredoka', ui-rounded, 'SF Pro Rounded', 'Nunito', 'Segoe UI', sans-serif" text-anchor="middle">
    <text x="600" y="150" font-size="76" font-weight="700" fill="#24452a">Nature <tspan fill="#447a2a">by Friends</tspan></text>
    <text x="600" y="200" font-size="28" font-weight="600" fill="#3f6e2c">Become a friend, not an owner.</text>
    <text x="600" y="238" font-size="20" fill="#5c5646">Meet the little lives that share your world · narrated with ElevenLabs</text>
  </g>

  <!-- butterfly -->
  <g transform="translate(250 6) scale(0.8)" filter="url(#soft)">
    <path d="M58 52 C 40 22, 10 26, 16 50 C 20 62, 40 64, 58 60 Z" fill="#e0785f" stroke="#2d2a22" stroke-width="2.5"/>
    <path d="M62 52 C 80 22, 110 26, 104 50 C 100 62, 80 64, 62 60 Z" fill="#e0785f" stroke="#2d2a22" stroke-width="2.5"/>
    <path d="M58 62 C 40 66, 26 84, 40 92 C 50 96, 56 80, 58 70 Z" fill="#f6d77a" stroke="#2d2a22" stroke-width="2.5"/>
    <path d="M62 62 C 80 66, 94 84, 80 92 C 70 96, 64 80, 62 70 Z" fill="#f6d77a" stroke="#2d2a22" stroke-width="2.5"/>
    <ellipse cx="60" cy="68" rx="5" ry="20" fill="#5c4632" stroke="#2d2a22" stroke-width="2.5"/>
    <circle cx="60" cy="44" r="9" fill="#5c4632" stroke="#2d2a22" stroke-width="2.5"/>
  </g>

  <!-- bee -->
  <g transform="translate(262 262) scale(0.6)" filter="url(#soft)">
    <ellipse cx="52" cy="40" rx="14" ry="20" transform="rotate(-25 52 40)" fill="#e2f1f7" stroke="#2d2a22" stroke-width="2.5"/>
    <ellipse cx="72" cy="40" rx="14" ry="20" transform="rotate(25 72 40)" fill="#e2f1f7" stroke="#2d2a22" stroke-width="2.5"/>
    <ellipse cx="66" cy="70" rx="32" ry="24" fill="#f6d77a" stroke="#2d2a22" stroke-width="2.5"/>
    <path d="M58 47 q -6 23 0 46 M74 47 q 6 23 0 46" fill="none" stroke="#2d2a22" stroke-width="7"/>
    <circle cx="34" cy="68" r="16" fill="#5c4632" stroke="#2d2a22" stroke-width="2.5"/>
    <circle cx="28" cy="66" r="4.5" fill="#fff"/><circle cx="29" cy="66" r="2.5" fill="#2d2a22"/>
    <circle cx="40" cy="66" r="4.5" fill="#fff"/><circle cx="41" cy="66" r="2.5" fill="#2d2a22"/>
  </g>

  <!-- sunflower -->
  <g transform="translate(940 170) scale(1.6)" filter="url(#soft)">
    <path d="M60 64 C 58 84, 62 98, 60 118" fill="none" stroke="#3f6e2c" stroke-width="4" stroke-linecap="round"/>
    <path d="M60 96 C 46 82, 30 86, 26 96 C 36 102, 50 102, 60 96 Z" fill="#7cb35a" stroke="#2d2a22" stroke-width="2.5"/>
    <g fill="#f6d77a" stroke="#2d2a22" stroke-width="2">
      <ellipse cx="60" cy="18" rx="7" ry="15"/><ellipse cx="60" cy="18" rx="7" ry="15" transform="rotate(45 60 44)"/>
      <ellipse cx="60" cy="18" rx="7" ry="15" transform="rotate(90 60 44)"/><ellipse cx="60" cy="18" rx="7" ry="15" transform="rotate(135 60 44)"/>
      <ellipse cx="60" cy="18" rx="7" ry="15" transform="rotate(180 60 44)"/><ellipse cx="60" cy="18" rx="7" ry="15" transform="rotate(225 60 44)"/>
      <ellipse cx="60" cy="18" rx="7" ry="15" transform="rotate(270 60 44)"/><ellipse cx="60" cy="18" rx="7" ry="15" transform="rotate(315 60 44)"/>
    </g>
    <circle cx="60" cy="44" r="19" fill="#7a4a30" stroke="#2d2a22" stroke-width="2.5"/>
    <circle cx="53" cy="42" r="4.5" fill="#fff"/><circle cx="54" cy="42" r="2.4" fill="#2d2a22"/>
    <circle cx="67" cy="42" r="4.5" fill="#fff"/><circle cx="68" cy="42" r="2.4" fill="#2d2a22"/>
    <path d="M57 52 q 3 3.6 6 0" fill="none" stroke="#2d2a22" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- ladybug -->
  <g transform="translate(400 312) scale(0.75)" filter="url(#soft)">
    <path d="M26 72 a 34 32 0 0 1 68 0 a 34 26 0 0 1 -68 0 Z" fill="#e0785f" stroke="#2d2a22" stroke-width="2.5"/>
    <path d="M60 42 L 60 98" stroke="#2d2a22" stroke-width="2.5"/>
    <circle cx="44" cy="62" r="6" fill="#2d2a22"/><circle cx="76" cy="62" r="6" fill="#2d2a22"/><circle cx="40" cy="82" r="5" fill="#2d2a22"/><circle cx="80" cy="82" r="5" fill="#2d2a22"/>
    <path d="M40 44 a 20 16 0 0 1 40 0 Z" fill="#2d2a22"/>
  </g>

  <!-- snail -->
  <g transform="translate(690 300) scale(0.85)" filter="url(#soft)">
    <path d="M14 96 C 14 84, 30 78, 44 80 L 98 80 C 108 80, 110 96, 98 96 Z" fill="#c9cfa2" stroke="#2d2a22" stroke-width="2.5"/>
    <path d="M26 82 L 22 54 M36 81 L 38 52" stroke="#2d2a22" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="22" cy="50" r="5" fill="#fff" stroke="#2d2a22" stroke-width="2"/><circle cx="38" cy="48" r="5" fill="#fff" stroke="#2d2a22" stroke-width="2"/>
    <circle cx="74" cy="60" r="27" fill="#d8a46a" stroke="#2d2a22" stroke-width="2.5"/>
    <path d="M74 60 m -3 0 a 3 3 0 1 1 6 0 a 8 8 0 1 1 -14 -2 a 14 14 0 1 1 26 6 a 20 20 0 1 1 -38 -8" fill="none" stroke="#8a5a3b" stroke-width="2.5"/>
  </g>

  <!-- sound wave: the narrator -->
  <g transform="translate(548 262)" stroke="#447a2a" stroke-width="6" stroke-linecap="round">
    <path d="M0 24 v 8"/><path d="M16 14 v 28"/><path d="M32 4 v 48"/><path d="M48 12 v 32"/><path d="M64 20 v 16"/><path d="M80 10 v 36"/><path d="M96 22 v 12"/>
  </g>
</svg>
